name: PowerShell quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Uses the same reusable workflow that other repositories call, so every push
  # here also exercises the published workflow.
  quality:
    uses: ./.github/workflows/powershell-guide-check.yml
    with:
      pester-path: .

  mermaid-unit-tests:
    name: Mermaid audit unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install unit-test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.4

      - name: Run Mermaid audit unit tests
        run: python -B -m unittest discover -s reference/scripts -p 'test_mermaid_audit.py' -v
