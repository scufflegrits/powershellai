name: PowerShell quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Uses the same reusable workflow that other repositories call, so every push
  # here also exercises the published workflow.
  quality:
    uses: ./.github/workflows/powershell-guide-check.yml
    with:
      pester-path: ./Tests
